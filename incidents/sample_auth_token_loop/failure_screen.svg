<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%" style="background:#18181b; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;">
  <!-- macOS Window Frame -->
  <rect width="1100" height="680" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  
  <!-- Window Header -->
  <path d="M 0 12 Q 0 0 12 0 L 1088 0 Q 1100 0 1100 12 L 1100 42 L 0 42 Z" fill="#27272a"/>
  <circle cx="20" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="21" r="6" fill="#27c93f"/>

  <!-- Chrome Tab -->
  <path d="M 80 42 L 95 12 L 290 12 L 305 42 Z" fill="#18181b"/>
  <text x="115" y="27" fill="#e4e4e7" font-size="12" font-weight="500">Acme Platform • Login Error</text>
  <text x="280" y="27" fill="#71717a" font-size="12">✕</text>

  <!-- URL Bar -->
  <rect x="80" y="48" width="940" height="30" rx="6" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <text x="96" y="68" fill="#eab308" font-size="12">⚠️</text>
  <text x="116" y="68" fill="#a1a1aa" font-size="12">https://</text>
  <text x="160" y="68" fill="#f4f4f5" font-size="12" font-weight="500">app.acmewear.io/auth/login?error=429_rate_limit_lockout</text>

  <!-- Left: Web App Login Lockout -->
  <g transform="translate(0, 84)">
    <rect width="550" height="596" fill="#09090b"/>
    <rect x="60" y="100" width="430" height="320" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    
    <text x="90" y="145" fill="#f4f4f5" font-size="18" font-weight="700">Account Access Suspended</text>
    <text x="90" y="175" fill="#a1a1aa" font-size="13">Security gateway detected automated retry flood.</text>

    <!-- Cloudflare Banner -->
    <rect x="90" y="200" width="370" height="80" rx="8" fill="#291a0c" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="228" fill="#fbbf24" font-size="13" font-weight="700">HTTP 429 Too Many Requests</text>
    <text x="110" y="250" fill="#fde68a" font-size="11" font-family="'JetBrains Mono', monospace">10 unthrottled refresh requests in 120ms</text>
    <text x="110" y="268" fill="#fef3c7" font-size="10.5" font-family="'JetBrains Mono', monospace">IP 10.42.0.8 blocked for 300s cooldown</text>
  </g>

  <!-- Divider -->
  <line x1="550" y1="84" x2="550" y2="680" stroke="#3f3f46" stroke-width="2"/>

  <!-- Right: Real Chrome DevTools Network Waterfall -->
  <g transform="translate(550, 84)">
    <rect width="550" height="596" fill="#121214"/>
    
    <!-- DevTools Toolbar -->
    <rect width="550" height="32" fill="#1f1f23" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="21" fill="#71717a" font-size="11">Elements</text>
    <text x="75" y="21" fill="#71717a" font-size="11">Console</text>
    <text x="135" y="21" fill="#e4e4e7" font-size="11" font-weight="700" text-decoration="underline">Network (10)</text>

    <!-- Network Table Header -->
    <rect y="32" width="550" height="24" fill="#18181b"/>
    <text x="16" y="48" fill="#71717a" font-size="10.5" font-weight="600">Name</text>
    <text x="210" y="48" fill="#71717a" font-size="10.5" font-weight="600">Status</text>
    <text x="290" y="48" fill="#71717a" font-size="10.5" font-weight="600">Type</text>
    <text x="360" y="48" fill="#71717a" font-size="10.5" font-weight="600">Time</text>
    <text x="440" y="48" fill="#71717a" font-size="10.5" font-weight="600">Waterfall</text>

    <!-- Network Rows (Infinite Rapid Loop) -->
    <g font-family="'JetBrains Mono', monospace" font-size="10.5">
      <rect y="58" width="550" height="24" fill="#201012"/>
      <text x="16" y="74" fill="#ef4444">POST /v1/auth/refresh</text>
      <text x="210" y="74" fill="#ef4444">401</text>
      <text x="290" y="74" fill="#71717a">fetch</text>
      <text x="360" y="74" fill="#a1a1aa">12ms</text>
      <rect x="440" y="65" width="20" height="8" rx="2" fill="#ef4444"/>

      <rect y="84" width="550" height="24" fill="#201012"/>
      <text x="16" y="100" fill="#ef4444">POST /v1/auth/refresh</text>
      <text x="210" y="100" fill="#ef4444">401</text>
      <text x="290" y="100" fill="#71717a">fetch</text>
      <text x="360" y="100" fill="#a1a1aa">10ms</text>
      <rect x="440" y="91" width="18" height="8" rx="2" fill="#ef4444"/>

      <rect y="110" width="550" height="24" fill="#291a0c"/>
      <text x="16" y="126" fill="#f59e0b">POST /v1/auth/refresh</text>
      <text x="210" y="126" fill="#f59e0b">429 (Blocked)</text>
      <text x="290" y="126" fill="#71717a">fetch</text>
      <text x="360" y="126" fill="#a1a1aa">4ms</text>
      <rect x="440" y="117" width="10" height="8" rx="2" fill="#f59e0b"/>
    </g>

    <!-- Initiator Trace -->
    <rect y="150" width="550" height="180" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="175" fill="#f59e0b" font-size="11" font-weight="700">Call Stack Initiator:</text>
    <text x="16" y="198" fill="#fca5a5" font-size="10.5" font-family="'JetBrains Mono', monospace">token_interceptor.ts:28: return client(originalRequest);</text>
    <text x="16" y="218" fill="#71717a" font-size="10" font-family="'JetBrains Mono', monospace">// WARNING: No backoff delay between retry attempts</text>
  </g>
</svg>
