<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- App Window Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Browser Chrome Bar -->
  <rect width="800" height="44" rx="16" fill="#1e293b"/>
  <rect y="32" width="800" height="12" fill="#1e293b"/>
  <circle cx="24" cy="22" r="6" fill="#ef4444"/>
  <circle cx="42" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="22" r="6" fill="#10b981"/>
  
  <rect x="120" y="10" width="560" height="24" rx="6" fill="#0f172a"/>
  <text x="140" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">https://shop.acme.corp/checkout/session_99812</text>
  
  <!-- App Content Skeleton -->
  <rect x="60" y="80" width="220" height="24" rx="4" fill="#334155"/>
  <rect x="60" y="120" width="420" height="14" rx="4" fill="#1e293b"/>
  <rect x="60" y="145" width="380" height="14" rx="4" fill="#1e293b"/>
  
  <!-- Cart Items -->
  <rect x="60" y="190" width="440" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="80" y="205" width="40" height="40" rx="6" fill="#475569"/>
  <rect x="135" y="210" width="160" height="14" rx="3" fill="#cbd5e1"/>
  <rect x="135" y="232" width="80" height="12" rx="3" fill="#64748b"/>
  <text x="440" y="230" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="bold" font-size="16">$149.00</text>
  
  <!-- Checkout Modal Overlay (The Failure State) -->
  <rect y="44" width="800" height="456" fill="rgba(0,0,0,0.7)"/>
  
  <g filter="url(#shadow)">
    <rect x="220" y="150" width="360" height="220" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  </g>
  
  <!-- Red Anomaly Bounding Box -->
  <rect x="210" y="140" width="380" height="240" rx="20" fill="none" stroke="#ef4444" stroke-dasharray="6,6" stroke-width="2"/>
  <rect x="220" y="118" width="190" height="20" rx="4" fill="#ef4444"/>
  <text x="228" y="132" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="10">ANOMALY: UI_SESSION_LOCK</text>
  
  <!-- Error Modal Content -->
  <circle cx="400" cy="205" r="22" fill="#fee2e2"/>
  <text x="394" y="214" fill="#ef4444" font-family="sans-serif" font-weight="bold" font-size="24">!</text>
  
  <text x="400" y="255" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="bold" font-size="16">Payment Session Failed</text>
  <text x="400" y="278" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">Internal Server Error: Unable to serialize user profile.</text>
  <text x="400" y="296" text-anchor="middle" fill="#ef4444" font-family="monospace" font-size="11">HTTP 500 [trace_id=tr_88a91c01]</text>
  
  <rect x="260" y="318" width="280" height="34" rx="8" fill="#ef4444"/>
  <text x="400" y="340" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="bold" font-size="13">Retry Payment</text>
</svg>
